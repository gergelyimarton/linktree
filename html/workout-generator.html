<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">

  <!-- LiDAR Design System -->

  <link rel="stylesheet" href="../lidar/CSS/lidar-components.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Workout Generator: page-scoped teal / green palette override -->
  <style>
    :root {
      --ld-void: #0f2027;
      --ld-surface: rgba(6, 16, 20, 0.55);
      --ld-panel: rgba(9, 22, 28, 0.72);
      --ld-panel-hover: rgba(12, 30, 37, 0.82);
      --ld-panel-active: rgba(15, 36, 44, 0.9);
      --ld-scan: #2ed573;
      --ld-scan-dim: rgba(46, 213, 115, 0.14);
      --ld-scan-glow: rgba(46, 213, 115, 0.12);
      --ld-scan-bright: #7bed9f;
      --ld-data-cyan: #7bed9f;
      --ld-text: #d6e6ea;
      --ld-text-dim: #7d9aa3;
      --ld-text-bright: #ffffff;
      --ld-border: rgba(123, 237, 159, 0.14);
      --ld-border-hover: rgba(46, 213, 115, 0.4);
      --ld-grid: rgba(46, 213, 115, 0.03);
    }
    [data-theme="light"] {
      --ld-void: #e8f4f8;
      --ld-surface: #f4fafc;
      --ld-panel: rgba(255, 255, 255, 0.9);
      --ld-panel-hover: #ffffff;
      --ld-panel-active: #f0f8f4;
      --ld-scan: #1a9d52;
      --ld-scan-dim: rgba(26, 157, 82, 0.14);
      --ld-scan-glow: rgba(26, 157, 82, 0.10);
      --ld-scan-bright: #148043;
      --ld-data-cyan: #1a9d52;
      --ld-text: #1f2d33;
      --ld-text-dim: #4f6770;
      --ld-text-bright: #0f1a1e;
      --ld-border: rgba(26, 157, 82, 0.2);
      --ld-border-hover: rgba(26, 157, 82, 0.45);
    }

    /* Keep the original deep-teal gradient with its green glows */
    body {
      background:
        radial-gradient(ellipse at 20% 20%, rgba(46, 213, 115, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 184, 148, 0.12) 0%, transparent 60%),
        linear-gradient(135deg, #0f2027 0%, #203a43 35%, #2c5364 65%, #1a3a4a 100%);
      background-attachment: fixed;
    }
    [data-theme="light"] body {
      background:
        radial-gradient(ellipse at 20% 20%, rgba(46, 213, 115, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 184, 148, 0.08) 0%, transparent 60%),
        linear-gradient(135deg, #e8f4f8 0%, #d4eaf2 35%, #c8e2ee 65%, #d0e8f0 100%);
      background-attachment: fixed;
    }
    [data-theme="light"] .ld-btn--primary,
    [data-theme="light"] .day-btn.selected {
      color: #ffffff;
    }

    /* No ambient 0/1 particle rain on this page */
    .ld-ambient-canvas {
      display: none !important;
    }

    /* Settings */
    .wg-settings {
      max-width: 800px;
      margin: 0 auto;
    }

    .setting-group + .setting-group {
      margin-top: var(--space-lg);
    }

    .setting-group > label {
      display: block;
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      letter-spacing: var(--tracking-mono);
      text-transform: uppercase;
      color: var(--ld-text-dim);
      margin-bottom: var(--space-sm);
    }

    .day-selector {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }

    .day-btn {
      width: 44px;
      height: 44px;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--ld-text);
      background: var(--ld-surface);
      border: 1px solid var(--ld-border);
      border-radius: var(--card-radius);
      cursor: pointer;
      transition:
        border-color var(--duration-fast) var(--ease-out),
        color var(--duration-fast) var(--ease-out),
        background-color var(--duration-fast) var(--ease-out),
        box-shadow var(--duration-fast) var(--ease-out);
    }

    .day-btn.recommended {
      border-color: var(--ld-border-hover);
      background: var(--ld-scan-dim);
    }

    .day-btn:hover {
      border-color: var(--ld-scan);
      color: var(--ld-scan);
    }

    .day-btn.selected {
      background: var(--ld-scan);
      border-color: var(--ld-scan);
      color: var(--ld-void);
      box-shadow: var(--shadow-glow);
    }

    .muscle-group-selector {
      display: none;
    }

    .muscle-group-selector.visible {
      display: block;
    }

    .muscle-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--ld-text-dim);
      background: var(--ld-surface);
      border: 1px solid var(--ld-border);
      border-radius: var(--card-radius);
      cursor: pointer;
      transition:
        border-color var(--duration-fast) var(--ease-out),
        color var(--duration-fast) var(--ease-out);
    }

    .checkbox-label:hover {
      border-color: var(--ld-border-hover);
    }

    .checkbox-label:has(input:checked) {
      color: var(--ld-scan);
      border-color: var(--ld-scan);
    }

    .checkbox-label input {
      width: 14px;
      height: 14px;
      accent-color: var(--ld-scan);
      cursor: pointer;
    }

    /* Plan */
    #plan {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--card-gap);
    }

    .day {
      position: relative;
      background: var(--ld-panel);
      border: 1px solid var(--ld-border);
      border-top: 2px solid var(--ld-scan-dim);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      backdrop-filter: blur(8px);
      transition:
        border-color var(--duration-base) var(--ease-out),
        transform var(--duration-base) var(--ease-out),
        box-shadow var(--duration-base) var(--ease-out);
    }

    .day:hover {
      border-color: var(--ld-border-hover);
      border-top-color: var(--ld-scan);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .day.generating {
      opacity: 0;
      transform: translateY(10px);
    }

    .day.fade-in {
      animation: ldFadeIn var(--duration-slow) var(--ease-out) forwards;
    }

    .day h2 {
      font-size: var(--text-xl);
      margin-bottom: var(--space-sm);
    }

    .muscle {
      display: inline-block;
      margin: var(--space-md) 0 var(--space-sm);
      padding: var(--space-xs) var(--space-sm);
      font-family: var(--font-mono);
      font-size: var(--text-2xs);
      letter-spacing: var(--tracking-mono);
      text-transform: uppercase;
      color: var(--ld-scan);
      border: 1px solid var(--ld-scan-dim);
      background: var(--ld-scan-dim);
    }

    .day ul {
      list-style: none;
    }

    .day li {
      position: relative;
      padding-left: var(--space-lg);
      margin-bottom: var(--space-xs);
      font-size: var(--text-sm);
      color: var(--ld-text);
    }

    .day li::before {
      content: '';
      position: absolute;
      left: 4px;
      top: 0.6em;
      width: 6px;
      height: 6px;
      background: var(--ld-scan);
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-md);
      margin-top: var(--space-2xl);
    }

    @media (max-width: 480px) {
      #plan {
        grid-template-columns: 1fr;
      }

      .button-container .ld-btn {
        width: 100%;
      }
    }
  </style>
</head>

  <script src="../lidar/JS/lidar-effects.js"></script>

  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
       // Translation mappings for dynamic content
       const translations = {
         dayPrefix: { hu: 'Nap', en: 'Day' },
         muscles: {
           Chest: { hu: 'Mell', en: 'Chest' },
           Back: { hu: 'Hát', en: 'Back' },
           Legs: { hu: 'Láb', en: 'Legs' },
           Arms: { hu: 'Kar', en: 'Arms' },
           Abs: { hu: 'Has', en: 'Abs' },
           Extras: { hu: 'Extra', en: 'Extras' }
         },
         downloadHeader: { hu: 'HETI EDZÉSTERV', en: 'WEEKLY WORKOUT PLAN' }
       };

       function getCurrentLang() {
         return document.documentElement.getAttribute('data-lang') || 'hu';
       }

       function translateDay(dayNum) {
         const lang = getCurrentLang();
         return `${translations.dayPrefix[lang]} ${dayNum}`;
       }

       function translateMuscle(muscle) {
         const lang = getCurrentLang();
         return translations.muscles[muscle]?.[lang] || muscle;
       }

       const exercises = {
          "Chest": [
            "Pushups",
            "Pseudo pushups",
            "Diamond pushups",
            "Dips",
            "Decline pushups",
            "Pike pushups",
            "Archer pushups",
            "Wide pushups",
            "Explosive pushups / clap pushups",
            "Ring pushups",
            "Chest flys (cables or rings)",
            "Bench press",
            "Incline bench press"
          ],

          "Legs": [
            "Weighted squats",
            "Bulgarian squats",
            "Attack steps (lunges)",
            "Step ups",
            "Squat hold",
            "Calf push",
            "Romanian deadlifts",
            "Nordic hamstring curls",
            "Pistol squats",
            "Jump squats",
            "Hip thrusts",
            "Glute bridges",
            "Seated calf raises"
          ],

          "Back": [
            "Pull ups",
            "Chin ups",
            "Standing rows",
            "Sitting rows",
            "Torso raises / deadlifts",
            "Inverted rows",
            "Lat pull downs",
            "Single-arm dumbbell rows",
            "Face pulls",
            "Back extensions",
            "Scapular pull ups"
          ],

          "Abs": [
            "Decline sit ups",
            "Leg raises",
            "Knee tucks",
            "Cable crunches",
            "Mountain climb",
            "Plank",
            "Side plank",
            "Hanging leg raises",
            "Russian twists",
            "Ab wheel rollouts",
            "Dead bugs",
            "V-ups"
          ],

          "Arms": [
            "Bicep curls / chin ups",
            "Cable pull downs (triceps)",
            "Lateral raises",
            "Overhead / military presses",
            "Arnold presses",
            "Hammer curls",
            "Concentration curls",
            "Skull crushers",
            "Close-grip bench press",
            "Triceps dips",
            "Front raises",
            "Rear delt raises"
          ],

          "Extras": [
            "Farmer walk",
            "Rope climbing",
            "Battle ropes",
            "Sled push / pull",
            "Loaded carries",
            "Grip hangs",
            "Neck flexion/extension",
            "Jump rope",
            "Conditioning circuits"
          ]
        };

        // State variables
        let selectedDays = 4;
        let currentSplit = 'push-pull-legs';
        let currentSchedule = {};

        // Split configurations
        const splitConfigs = {
          'push-pull-legs': {
            1: { "Day 1": ["Chest", "Back", "Legs", "Arms", "Abs"] },
            2: { "Day 1": ["Chest", "Arms", "Abs"], "Day 2": ["Back", "Legs", "Abs"] },
            3: { "Day 1": ["Chest", "Arms"], "Day 2": ["Back", "Abs"], "Day 3": ["Legs", "Abs"] },
            4: { "Day 1": ["Chest", "Arms"], "Day 2": ["Legs", "Abs"], "Day 3": ["Back", "Arms"], "Day 4": ["Legs", "Abs"] },
            5: { "Day 1": ["Chest", "Arms"], "Day 2": ["Legs"], "Day 3": ["Back", "Abs"], "Day 4": ["Chest", "Arms"], "Day 5": ["Legs", "Abs"] },
            6: { "Day 1": ["Chest", "Arms"], "Day 2": ["Back", "Abs"], "Day 3": ["Legs"], "Day 4": ["Chest", "Arms"], "Day 5": ["Back", "Abs"], "Day 6": ["Legs"] },
            7: { "Day 1": ["Chest", "Arms"], "Day 2": ["Back", "Abs"], "Day 3": ["Legs"], "Day 4": ["Chest", "Arms"], "Day 5": ["Back", "Abs"], "Day 6": ["Legs"], "Day 7": ["Arms", "Abs"] }
          },
          'upper-lower': {
            1: { "Day 1": ["Chest", "Back", "Arms", "Legs", "Abs"] },
            2: { "Day 1": ["Chest", "Back", "Arms", "Abs"], "Day 2": ["Legs", "Abs"] },
            3: { "Day 1": ["Chest", "Back", "Arms"], "Day 2": ["Legs", "Abs"], "Day 3": ["Chest", "Back", "Arms"] },
            4: { "Day 1": ["Chest", "Back", "Arms"], "Day 2": ["Legs", "Abs"], "Day 3": ["Chest", "Back", "Arms"], "Day 4": ["Legs", "Abs"] },
            5: { "Day 1": ["Chest", "Back", "Arms"], "Day 2": ["Legs", "Abs"], "Day 3": ["Chest", "Back", "Arms"], "Day 4": ["Legs", "Abs"], "Day 5": ["Chest", "Back", "Arms"] },
            6: { "Day 1": ["Chest", "Back", "Arms"], "Day 2": ["Legs", "Abs"], "Day 3": ["Chest", "Back", "Arms"], "Day 4": ["Legs", "Abs"], "Day 5": ["Chest", "Back", "Arms"], "Day 6": ["Legs", "Abs"] },
            7: { "Day 1": ["Chest", "Back", "Arms"], "Day 2": ["Legs", "Abs"], "Day 3": ["Chest", "Back", "Arms"], "Day 4": ["Legs", "Abs"], "Day 5": ["Chest", "Back", "Arms"], "Day 6": ["Legs", "Abs"], "Day 7": ["Abs", "Extras"] }
          },
          'full-body': {
            1: { "Day 1": ["Chest", "Back", "Legs", "Arms", "Abs"] },
            2: { "Day 1": ["Chest", "Back", "Legs", "Arms", "Abs"], "Day 2": ["Chest", "Back", "Legs", "Arms", "Abs"] },
            3: { "Day 1": ["Chest", "Back", "Legs", "Arms", "Abs"], "Day 2": ["Chest", "Back", "Legs", "Arms", "Abs"], "Day 3": ["Chest", "Back", "Legs", "Arms", "Abs"] },
            4: { "Day 1": ["Chest", "Back", "Legs", "Abs"], "Day 2": ["Chest", "Back", "Legs", "Abs"], "Day 3": ["Chest", "Back", "Legs", "Abs"], "Day 4": ["Arms", "Abs", "Extras"] },
            5: { "Day 1": ["Chest", "Back", "Legs", "Abs"], "Day 2": ["Chest", "Back", "Legs", "Abs"], "Day 3": ["Chest", "Back", "Legs", "Abs"], "Day 4": ["Chest", "Back", "Legs", "Abs"], "Day 5": ["Arms", "Abs"] },
            6: { "Day 1": ["Chest", "Back", "Legs", "Abs"], "Day 2": ["Chest", "Back", "Legs", "Abs"], "Day 3": ["Chest", "Back", "Legs", "Abs"], "Day 4": ["Chest", "Back", "Legs", "Abs"], "Day 5": ["Chest", "Back", "Legs", "Abs"], "Day 6": ["Arms", "Abs"] },
            7: { "Day 1": ["Chest", "Back", "Legs", "Abs"], "Day 2": ["Chest", "Back", "Legs", "Abs"], "Day 3": ["Chest", "Back", "Legs", "Abs"], "Day 4": ["Chest", "Back", "Legs", "Abs"], "Day 5": ["Chest", "Back", "Legs", "Abs"], "Day 6": ["Chest", "Back", "Legs", "Abs"], "Day 7": ["Arms", "Abs"] }
          },
          'bro-split': {
            1: { "Day 1": ["Chest", "Back", "Legs", "Arms", "Abs"] },
            2: { "Day 1": ["Chest", "Back", "Arms"], "Day 2": ["Legs", "Abs"] },
            3: { "Day 1": ["Chest", "Arms"], "Day 2": ["Back", "Abs"], "Day 3": ["Legs"] },
            4: { "Day 1": ["Chest"], "Day 2": ["Back"], "Day 3": ["Legs"], "Day 4": ["Arms", "Abs"] },
            5: { "Day 1": ["Chest"], "Day 2": ["Back"], "Day 3": ["Legs"], "Day 4": ["Arms"], "Day 5": ["Abs", "Extras"] },
            6: { "Day 1": ["Chest"], "Day 2": ["Back"], "Day 3": ["Legs"], "Day 4": ["Arms"], "Day 5": ["Abs"], "Day 6": ["Extras"] },
            7: { "Day 1": ["Chest"], "Day 2": ["Back"], "Day 3": ["Legs"], "Day 4": ["Arms"], "Day 5": ["Abs"], "Day 6": ["Chest", "Back"], "Day 7": ["Legs", "Arms"] }
          }
        };

        // Initialize day button handlers
        document.querySelectorAll('.day-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
            this.classList.add('selected');
            selectedDays = parseInt(this.dataset.days);
            generatePlan();
          });
        });

        // Handle split change
        function onSplitChange() {
          const splitSelect = document.getElementById('splitSelect');
          currentSplit = splitSelect.value;
          const muscleSelector = document.getElementById('muscleGroupSelector');

          if (currentSplit === 'custom') {
            muscleSelector.classList.add('visible');
          } else {
            muscleSelector.classList.remove('visible');
          }

          generatePlan();
        }

        // Get selected muscles for custom split
        function getSelectedMuscles() {
          const checkboxes = document.querySelectorAll('#muscleGroupSelector input[type="checkbox"]:checked');
          return Array.from(checkboxes).map(cb => cb.value);
        }

        // Generate custom schedule based on selected muscles and days
        function generateCustomSchedule(days, muscles) {
          const schedule = {};
          if (muscles.length === 0) return schedule;

          for (let i = 1; i <= days; i++) {
            const dayMuscles = [];
            // Distribute muscles across days
            muscles.forEach((muscle, index) => {
              if (index % days === (i - 1) % days || days >= muscles.length) {
                dayMuscles.push(muscle);
              }
            });
            // Ensure each day has at least one muscle
            if (dayMuscles.length === 0) {
              dayMuscles.push(muscles[(i - 1) % muscles.length]);
            }
            schedule[`Day ${i}`] = dayMuscles;
          }
          return schedule;
        }

        // Build current schedule based on settings
        function buildSchedule() {
          if (currentSplit === 'custom') {
            const muscles = getSelectedMuscles();
            currentSchedule = generateCustomSchedule(selectedDays, muscles);
          } else {
            currentSchedule = splitConfigs[currentSplit][selectedDays] || {};
          }
          return currentSchedule;
        }

        // Add event listeners to muscle checkboxes for live update
        document.querySelectorAll('#muscleGroupSelector input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', function() {
            if (currentSplit === 'custom') {
              generatePlan();
            }
          });
        });

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';

        function getRandomMoves(moves, count = 4) {
          if (moves.length <= count) return [...moves];
          const shuffled = [...moves].sort(() => 0.5 - Math.random());
          return shuffled.slice(0, count);
        }

        function decryptText(element, finalText, duration = 600) {
          const iterations = Math.floor(duration / 50);
          let iteration = 0;

          // Get available width for the text
          const maxWidth = element.offsetWidth;
          
          const interval = setInterval(() => {
            const displayText = finalText
              .split('')
              .map((char, index) => {
                if (index < iteration) {
                  return finalText[index];
                }
                return chars[Math.floor(Math.random() * chars.length)];
              })
              .join('');
            
            element.textContent = displayText;

            iteration += 1;

            if (iteration > finalText.length) {
              clearInterval(interval);
              element.textContent = finalText;
            }
          }, 50);
        }

        function generatePlan() {
          const planDiv = document.getElementById("plan");
          planDiv.innerHTML = "";

          const schedule = buildSchedule();

          const allDays = [];
          let dayIndex = 0;

          for (const [day, groups] of Object.entries(schedule)) {
            const dayDiv = document.createElement("div");
            dayDiv.className = "day generating";

            // Extract day number and translate
            const dayNum = day.replace('Day ', '');
            const dayTitle = document.createElement("h2");
            dayTitle.textContent = translateDay(dayNum);
            dayDiv.appendChild(dayTitle);

            groups.forEach(muscle => {
              const muscleTitle = document.createElement("div");
              muscleTitle.className = "muscle";
              muscleTitle.textContent = translateMuscle(muscle);
              dayDiv.appendChild(muscleTitle);

              const list = document.createElement("ul");
              const moves = getRandomMoves(exercises[muscle]);
              moves.forEach(move => {
                const li = document.createElement("li");
                li.textContent = move;
                li.dataset.finalText = move;
                list.appendChild(li);
              });
              dayDiv.appendChild(list);
            });

            planDiv.appendChild(dayDiv);
            allDays.push(dayDiv);
          }

          // Set fixed dimensions before animation to prevent layout shift
          allDays.forEach(dayDiv => {
            const height = dayDiv.offsetHeight;
            const width = dayDiv.offsetWidth;
            dayDiv.style.height = height + 'px';
            dayDiv.style.width = width + 'px';
            
            const listItems = dayDiv.querySelectorAll('li');
            listItems.forEach(li => {
              const liHeight = li.offsetHeight;
              const liWidth = li.offsetWidth;
              li.style.height = liHeight + 'px';
              li.style.width = liWidth + 'px';
            });
          });

          // Animate each day card appearing
          allDays.forEach((dayDiv, index) => {
            setTimeout(() => {
              dayDiv.classList.remove('generating');
              dayDiv.classList.add('fade-in');

              // Animate text decryption for exercise items
              const listItems = dayDiv.querySelectorAll('li');
              listItems.forEach((li, liIndex) => {
                const finalText = li.dataset.finalText;
                setTimeout(() => {
                  decryptText(li, finalText, 500);
                }, liIndex * 80);
              });
            }, index * 200);
          });
        }

        function downloadTXT() {
          const schedule = buildSchedule();
          const lang = getCurrentLang();
          const header = translations.downloadHeader[lang];
          let text = `${header}\n`;
          text += "=".repeat(header.length) + "\n\n";

          for (const [day, groups] of Object.entries(schedule)) {
            const dayNum = day.replace('Day ', '');
            const translatedDay = translateDay(dayNum);
            text += `${translatedDay}\n`;
            text += "-".repeat(translatedDay.length) + "\n";

            groups.forEach(muscle => {
              const translatedMuscle = translateMuscle(muscle);
              text += `  [${translatedMuscle}]\n`;
              const moves = getRandomMoves(exercises[muscle]);
              moves.forEach(move => {
                text += `    • ${move}\n`;
              });
              text += "\n";
            });
            text += "\n";
          }

          const blob = new Blob([text], { type: "text/plain" });
          const url = URL.createObjectURL(blob);

          const a = document.createElement("a");
          a.href = url;
          a.download = "workout-plan.txt";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }


        // Regenerate plan when language changes
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            if (mutation.attributeName === 'data-lang') {
              generatePlan();
            }
          });
        });
        observer.observe(document.documentElement, { attributes: true });

        // Betöltéskor generálás
        generatePlan();
    </script>

</body>
